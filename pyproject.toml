[project]
name = "lighthouse-navigator"
version = "0.1.0"
description = "Personal travel planning, history and memories"
requires-python = ">=3.10"
dependencies = [
    "fastapi",
    "uvicorn",
    "pydantic>=2",
    "python-dotenv",
    "langchain",
    "langgraph",
    "langchain-google-genai>=4.4,<5",
    "psycopg2-binary",
]

[dependency-groups]
dev = ["httpx>=0.28,<1"]

[tool.uv]
package = false
